name: Build and test desktop applications

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install chromium
      - run: npm run test:e2e
      - run: npm run build
      - name: Verify native desktop shell
        run: node scripts/smoke-electron.mjs
      - name: Verify Scholar collection and isolation
        run: node scripts/smoke-scholar.mjs
      - name: Package installers
        shell: bash
        run: |
          # Missing GitHub secrets become empty strings; the builder treats an empty CSC_LINK as a file path.
          for name in CSC_LINK CSC_KEY_PASSWORD WIN_CSC_LINK WIN_CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!name}" ]]; then unset "$name"; fi
          done
          if [[ "${{ matrix.platform }}" == "mac" && -n "${CSC_LINK:-}" ]]; then
            npm run dist:mac:signed
          else
            npm run dist:${{ matrix.platform }}
          fi
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Verify packaged application
        run: node scripts/smoke-electron.mjs --packaged
      - name: Verify packaged Scholar browser
        run: node scripts/smoke-scholar.mjs --packaged
      - uses: actions/upload-artifact@v4
        with:
          name: Academic-Publication-Tracker-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.blockmap

  draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: Create draft release with installers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" installers/* --draft --verify-tag --generate-notes --title "Academic Publication Tracker $RELEASE_TAG"
          fi
