<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'"
    />
    <title>Google Scholar · Academic Publication Tracker</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #f5f6f8;
        color: #283447;
        font:
          13px/1.4 -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
      }
      main {
        height: 184px;
        padding: 16px 22px;
        border-bottom: 1px solid #dce2e9;
      }
      .bar {
        display: flex;
        gap: 9px;
        align-items: center;
      }
      .brand {
        margin-right: auto;
        display: flex;
        gap: 12px;
        align-items: center;
      }
      .mark {
        width: 34px;
        height: 34px;
        border-radius: 9px;
        display: grid;
        place-items: center;
        background: #e5edf8;
        color: #345b8d;
        font-size: 20px;
        font-weight: 700;
      }
      strong {
        display: block;
        font-size: 15px;
      }
      #count {
        color: #637185;
        font-size: 12px;
      }
      button {
        height: 35px;
        padding: 0 14px;
        background: white;
        border: 1px solid #d1d9e3;
        border-radius: 7px;
        font: inherit;
        font-weight: 600;
        color: #344258;
        cursor: pointer;
      }
      button:hover {
        background: #edf2f8;
      }
      button:focus-visible {
        outline: 3px solid #93b4e0;
        outline-offset: 2px;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      #resume {
        background: #3565a1;
        color: white;
        border-color: #3565a1;
      }
      #stop {
        background: #e9f2ec;
        color: #316446;
        border-color: #c5dacd;
      }
      #cancel {
        background: transparent;
      }
      #location {
        margin-top: 10px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        font-size: 11px;
        color: #69778a;
      }
      #status {
        margin: 6px 0;
        min-height: 35px;
        font-weight: 550;
      }
      .help {
        margin: 4px 0 0;
        font-size: 11px;
        color: #6c7888;
      }
    </style>
  </head>
  <body>
    <main aria-label="Google Scholar verification controls">
      <div class="bar">
        <div class="brand">
          <span class="mark" aria-hidden="true">S</span>
          <div><strong>Google Scholar</strong><span id="count">0 papers</span></div>
        </div>
        <button id="resume" disabled>Resume search</button>
        <button id="stop">Stop and keep results</button>
        <button id="cancel">Cancel</button>
      </div>
      <div id="location">Opening Google Scholar…</div>
      <p id="status" role="status" aria-live="polite">
        Papers are retrieved in the background. Complete any Google verification yourself, then
        resume.
      </p>
      <p class="help">
        Stop keeps retrieved papers; Cancel discards this search. Closing this window also keeps
        results. Any Google sign-in lasts only for this search.
      </p>
    </main>
  </body>
</html>
