appId: org.academicpublicationtracker.desktop
productName: Academic Publication Tracker
copyright: Copyright © 2026 Academic Publication Tracker contributors
asar: true
npmRebuild: false
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - dist-electron/**
  - package.json
  - LICENSE
  - '!**/*.map'
artifactName: Academic-Publication-Tracker-${version}-${os}-${arch}.${ext}
mac:
  category: public.app-category.education
  hardenedRuntime: true
  gatekeeperAssess: false
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
dmg:
  title: Academic Publication Tracker
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false
